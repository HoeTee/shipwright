<svg viewBox="0 0 656 63" width="656" height="63" role="img" aria-label="Flowchart: Task, Select stage, Build, Review, Human decision" xmlns="http://www.w3.org/2000/svg"><style><![CDATA[
svg { font-family: "Segoe UI", Arial, sans-serif; background: #f6f6f3; }
text { fill: #16181d; font-size: 13px; font-family: "Segoe UI", Arial, sans-serif; }
.am-node-shape { fill: #ffffff; stroke: #1d2026; stroke-width: 1.5; }
.am-node--hi .am-node-shape { fill: #e4ecf8; stroke: #1d5fbf; }
.am-node-text { fill: #16181d; font-size: 13px; font-family: "Segoe UI", Arial, sans-serif; }
.am-node--hi .am-node-text { fill: #1d5fbf; font-weight: 600; }
.am-edge { fill: none; stroke: #4b5260; stroke-width: 1.3; }
.am-arrow { fill: #4b5260; }
.am-edge-label rect { fill: #ffffff; }
.am-edge-label text { fill: #1d5fbf; font-size: 11.5px; font-family: "Segoe UI", Arial, sans-serif; }
.am-cluster { fill: #f3f5f8; stroke: #d6dae1; stroke-width: 1; stroke-dasharray: 4 3; }
.am-cluster-label { fill: #4b5260; font-size: 11px; font-family: ui-monospace, "Segoe UI", monospace; }
