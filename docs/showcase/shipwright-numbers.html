<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipwright numbers</title>
<!--
  Same system as the hero. Bars compare Python lines. Plain is 100. Skills is 56.6.
  No pass-rate fraction. The line under the bars says the pass rate is the same.
-->
<style>
  @font-face { font-family: "Display"; src: url("file:///usr/share/fonts/truetype/noto/NotoSansDisplay-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Text"; src: url("file:///usr/share/fonts/truetype/noto/NotoSans-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1760px; height: 640px; overflow: hidden; background: #F4F1E7; color: #111111; }
  .sheet { box-sizing: border-box; width: 1760px; height: 640px; padding: 56px 64px 48px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { margin: 0; font-family: "Display", "Noto Sans Display", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.04em; line-height: 1; }
  .bars { display: flex; flex-direction: column; gap: 22px; margin-top: 28px; }
  .bar { display: grid; grid-template-columns: 220px 1fr 140px; align-items: center; gap: 24px; }
  .bar b, .bar em { font-style: normal; font-family: "Display", "Noto Sans Display", sans-serif; font-weight: 700; font-size: 48px; letter-spacing: -0.04em; }
  .track { height: 72px; background: transparent; }
  .fill { height: 72px; }
  .plain { width: 100%; background: #111111; }
  .skills { width: 56.6%; background: #1E3FFF; }
  .note { margin: 0; font-family: "Text", "Noto Sans", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1.2; }
</style>
</head>
<body>
  <div class="sheet">
    <div>
      <h1>Python lines changed</h1>
      <div class="bars">
        <div class="bar">
          <b>No skills</b>
          <div class="track"><div class="fill plain"></div></div>
          <em>100</em>
        </div>
        <div class="bar">
          <b>Skills</b>
          <div class="track"><div class="fill skills"></div></div>
          <em>56.6</em>
        </div>
      </div>
    </div>
    <p class="note">43% fewer Python lines. The 95% interval is 27% to 57% fewer. Same pass rate.</p>
  </div>
</body>
</html>
