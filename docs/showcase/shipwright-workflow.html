<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipwright workflow</title>
<!--
  Same system as the hero: cream ground, ink rules, one cobalt block for Human merge.
  One horizontal row. Sharp corners. No shadow.
-->
<style>
  @font-face { font-family: "Display"; src: url("file:///usr/share/fonts/truetype/noto/NotoSansDisplay-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; background: #F4F1E7; }
  .row {
    display: flex;
    align-items: center;
    gap: 0;
    width: max-content;
    padding: 28px 32px;
    background: #F4F1E7;
  }
  .node {
    box-sizing: border-box;
    height: 132px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #111111;
    background: #F4F1E7;
    color: #111111;
    font-family: "Display", "Noto Sans Display", sans-serif;
    font-weight: 700;
    font-size: 64px;
    letter-spacing: -0.04em;
    line-height: 1;
    white-space: nowrap;
  }
  .human { background: #1E3FFF; color: #F4F1E7; border-color: #1E3FFF; }
  .gap { width: 36px; height: 132px; position: relative; flex: none; }
  .gap::before {
    content: "";
    position: absolute;
    left: 0; right: 8px; top: 50%;
    height: 3px;
    background: #111111;
  }
  .gap::after {
    content: "";
    position: absolute;
    right: 0; top: 50%;
    width: 14px; height: 14px;
    border-top: 3px solid #111111;
    border-right: 3px solid #111111;
    transform: translateY(-50%) rotate(45deg);
  }
  .loop {
    width: 176px;
    height: 132px;
    flex: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .lab {
    text-align: center;
    font-family: "Display", "Noto Sans Display", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.03em;
    color: #1E3FFF;
    line-height: 1;
  }
  .arr { position: relative; height: 16px; }
  .arr::before {
    content: "";
    position: absolute;
    left: 6px; right: 16px; top: 7px;
    height: 3px;
    background: #111111;
  }
  .arr::after {
    content: "";
    position: absolute;
    top: 2px;
    width: 11px; height: 11px;
    border-top: 3px solid #111111;
    border-right: 3px solid #111111;
  }
  .arr.go::after { right: 2px; transform: rotate(45deg); }
  .arr.back::before { left: 16px; right: 6px; }
  .arr.back::after { left: 2px; transform: rotate(-135deg); }
  .clear {
    width: 150px;
    height: 132px;
    flex: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .clear .shaft { position: relative; height: 16px; }
  .clear .shaft::before {
    content: "";
    position: absolute;
    left: 0; right: 16px; top: 7px;
    height: 3px;
    background: #111111;
  }
  .clear .shaft::after {
    content: "";
    position: absolute;
    right: 2px; top: 2px;
    width: 11px; height: 11px;
    border-top: 3px solid #111111;
    border-right: 3px solid #111111;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="row" id="row">
    <div class="node">Task</div>
    <div class="gap"></div>
    <div class="node">Plan</div>
    <div class="gap"></div>
    <div class="node">Build</div>
    <div class="gap"></div>
    <div class="node">Review</div>
    <div class="loop">
      <div class="lab">block</div>
      <div class="arr go"></div>
      <div class="arr back"></div>
      <div class="lab">again</div>
    </div>
    <div class="node">Fix</div>
    <div class="clear">
      <div class="lab">clear</div>
      <div class="shaft"></div>
    </div>
    <div class="node">Ship</div>
    <div class="gap"></div>
    <div class="node human">Human merge</div>
  </div>
</body>
</html>
