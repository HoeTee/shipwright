<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipwright workflow</title>
<style>
  @font-face { font-family: "Display"; src: url("file:///usr/share/fonts/truetype/noto/NotoSansDisplay-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; background: #F4F1E7; }
  .sheet {
    box-sizing: border-box;
    width: 960px;
    padding: 28px 32px 32px;
    background: #F4F1E7;
    color: #111111;
  }
  .row { display: flex; align-items: stretch; gap: 12px; }
  .row + .row { margin-top: 16px; }
  .card, .loop {
    box-sizing: border-box;
    min-height: 118px;
    border: 4px solid #111111;
    background: #F4F1E7;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card { flex: 1; padding: 14px 18px 16px; }
  .card b, .num {
    font-family: "Display", "Noto Sans Display", sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.03em;
    color: #1E3FFF;
    line-height: 1;
  }
  .card span, .word {
    font-family: "Display", "Noto Sans Display", sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  .wide { background: #1E3FFF; border-color: #1E3FFF; color: #F4F1E7; }
  .wide b { color: #F4F1E7; }
  .arrow {
    width: 28px;
    height: 4px;
    background: #111111;
    position: relative;
    flex: none;
    align-self: center;
  }
  .arrow::after {
    content: "";
    position: absolute;
    right: -2px;
    top: -6px;
    width: 12px;
    height: 12px;
    border-top: 4px solid #111111;
    border-right: 4px solid #111111;
    transform: rotate(45deg);
  }
  .loop {
    flex: 1.45;
    border-color: #1E3FFF;
    padding: 14px 16px 12px;
    gap: 8px;
  }
  .pair { display: flex; align-items: center; gap: 10px; }
  .word { padding: 2px 0; }
  .swap { width: 36px; display: flex; flex-direction: column; gap: 8px; flex: none; }
  .swap i { display: block; height: 4px; background: #1E3FFF; position: relative; }
  .swap i::after {
    content: "";
    position: absolute;
    top: -5px;
    width: 10px;
    height: 10px;
    border-top: 4px solid #1E3FFF;
    border-right: 4px solid #1E3FFF;
  }
  .swap i.go::after { right: -1px; transform: rotate(45deg); }
  .swap i.back::after { left: -1px; transform: rotate(-135deg); }
  .until {
    margin: 0;
    font-family: "Display", "Noto Sans Display", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.03em;
    color: #1E3FFF;
  }
</style>
</head>
<body>
  <div class="sheet" id="sheet">
    <div class="row">
      <div class="card"><b>01</b><span>Task</span></div>
      <div class="arrow"></div>
      <div class="card"><b>02</b><span>Plan</span></div>
      <div class="arrow"></div>
      <div class="card"><b>03</b><span>Build</span></div>
    </div>
    <div class="row">
      <div class="loop">
        <b class="num">04</b>
        <div class="pair">
          <div class="word">Review</div>
          <div class="swap"><i class="go"></i><i class="back"></i></div>
          <div class="word">Fix</div>
        </div>
        <p class="until">Loop until clear</p>
      </div>
      <div class="arrow"></div>
      <div class="card"><b>05</b><span>Ship</span></div>
      <div class="arrow"></div>
      <div class="card wide"><b>06</b><span>Human merge</span></div>
    </div>
  </div>
</body>
</html>
