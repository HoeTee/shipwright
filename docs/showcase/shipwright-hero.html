<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipwright hero</title>
<style>
  @font-face { font-family: "Display"; src: url("file:///usr/share/fonts/truetype/noto/NotoSansDisplay-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Text"; src: url("file:///usr/share/fonts/truetype/noto/NotoSans-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1760px; height: 460px; overflow: hidden; background: #F4F1E7; }
  .frame { display: flex; width: 1760px; height: 460px; }
  .left, .right { box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
  .left { width: 980px; padding: 36px 48px 36px 72px; color: #111111; }
  .right { width: 780px; padding: 36px 64px; background: #1E3FFF; color: #F4F1E7; }
  .name, .num, .tag, .label { margin: 0; text-wrap: pretty; }
  .name { font-family: "Display", "Noto Sans Display", sans-serif; font-weight: 700; font-size: 120px; letter-spacing: -0.05em; line-height: 0.86; }
  .tag { margin-top: 18px; font-family: "Text", "Noto Sans", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1.15; max-width: 16em; }
  .num { font-family: "Display", "Noto Sans Display", sans-serif; font-weight: 700; font-size: 188px; letter-spacing: -0.06em; line-height: 0.8; }
  .label { margin-top: 16px; font-family: "Text", "Noto Sans", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.03em; line-height: 1.05; }
</style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <p class="name">shipwright</p>
      <p class="tag">From the first look to a human merge.</p>
    </div>
    <div class="right">
      <p class="num">-43%</p>
      <p class="label">Python lines changed</p>
    </div>
  </div>
</body>
</html>
