<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipwright hero</title>
<style>
  html, body {
    margin: 0;
    width: 1760px;
    height: 700px;
    overflow: hidden;
    background: #0b1020;
  }
  body {
    font-family: "Noto Sans", "Segoe UI", sans-serif;
    color: #f5f8fc;
    position: relative;
  }
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(820px 520px at 22% 58%, rgba(47, 104, 196, 0.55), transparent 68%),
      radial-gradient(640px 420px at 78% 46%, rgba(28, 74, 150, 0.38), transparent 70%),
      linear-gradient(180deg, #12182b 0%, #0b1020 100%);
  }
  .brand {
    position: absolute;
    top: 40px;
    left: 72px;
    z-index: 2;
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b7c7dc;
  }
  .row {
    position: relative;
    z-index: 2;
    height: 700px;
    display: flex;
    align-items: center;
  }
  .left {
    width: 980px;
    padding: 36px 40px 0 72px;
    box-sizing: border-box;
  }
  .num {
    margin: 0;
    font-size: 228px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 0.86;
  }
  .label {
    margin: 22px 0 0;
    font-size: 58px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #d5e0ee;
  }
  .rule {
    width: 2px;
    height: 250px;
    background: rgba(255, 255, 255, 0.18);
    flex: none;
  }
  .right {
    flex: 1;
    padding: 36px 64px 0 72px;
  }
  .kicker {
    margin: 0 0 18px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b7c7dc;
  }
  .score {
    margin: 0;
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    white-space: nowrap;
  }
  .vs {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #b7c7dc;
    padding: 0 18px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <p class="brand">Shipwright</p>
  <div class="row">
    <div class="left">
      <p class="num">-43%</p>
      <p class="label">Python lines changed</p>
    </div>
    <div class="rule"></div>
    <div class="right">
      <p class="kicker">Same pass rate</p>
      <p class="score">30/32<span class="vs">vs</span>30/32</p>
    </div>
  </div>
</body>
</html>
