name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Run regression and renderer integrity tests
        run: python -B -m unittest discover -s scripts -v
      - name: Validate shipwright skills
        run: python -B -m unittest discover -s tests -v
      - name: Run shipwright-eval tests and selftest
        run: |
          python -B -m unittest discover -s skills/shipwright-eval/scripts -v
          python -B skills/shipwright-eval/scripts/selftest.py
      - name: Run the original plan checker
        run: bun test skills/shipwright-autopilot/scripts/check-plan.test.ts
